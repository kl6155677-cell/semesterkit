<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign Up - SemesterKit.com</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f0f7ff', 100: '#e0effe', 500: '#1d7bf5', 600: '#1565d8', 700: '#0f4ea8' },
            navy: { 900: '#0b1325', 950: '#070c18' }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            handwriting: ['Caveat', 'cursive']
          }
        }
      }
    }
  </script>
<style>
  html, body {
    overflow-x: hidden !important;
    max-width: 100vw !important;
    width: 100% !important;
    margin: 0;
    padding: 0;
  }
  * {
    box-sizing: border-box;
  }
</style>
</head>
<body class="bg-[#f8faff] text-[#1e293b] font-sans antialiased min-h-screen flex flex-col">
<header class="w-full bg-white border-b border-gray-100 sticky top-0 z-50">
<div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 h-16 sm:h-20 flex items-center justify-between gap-2">
<div class="flex items-center space-x-2.5">
<div class="text-[#1d7bf5]">
<svg class="w-8 h-8 sm:w-9 sm:h-9" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z"></path></svg>
</div>
<a class="text-xl sm:text-2xl font-extrabold text-[#111827] tracking-tight" href="/">SemesterKit<span class="text-[#1d7bf5]">.com</span></a>
</div>
<nav class="hidden md:flex items-center space-x-8 text-[15px] font-medium text-gray-600">
<a class="hover:text-[#1d7bf5] transition" href="/index.html">Home</a>
<a class="hover:text-[#1d7bf5] transition" href="/btech.html">B.Tech</a>
<a class="hover:text-[#1d7bf5] transition" href="/mtech.html">M.Tech</a>
<a class="hover:text-[#1d7bf5] transition" href="/phd.html">PhD</a>
<a class="hover:text-[#1d7bf5] transition" href="/upload.html">Upload</a>
</nav>
<div class="auth-actions-container flex items-center space-x-2 sm:space-x-4">
<button class="px-3 sm:px-5 py-1.5 sm:py-2 text-xs sm:text-sm font-semibold text-[#1d7bf5] hover:text-[#1565d8] transition" type="button" onclick="window.location.href='/login.html'">Login</button>
<button class="px-3 sm:px-6 py-1.5 sm:py-2.5 bg-[#1d7bf5] hover:bg-[#1565d8] text-white text-xs sm:text-sm font-semibold rounded-full shadow-sm transition" type="button" onclick="window.location.href='/register.html'">Sign Up</button>
</div>
</div>
</header>

<main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
    <div class="text-center mb-8">
      <h2 class="text-3xl font-extrabold text-[#0f172a]">Create an Account</h2>
      <p class="mt-2 text-sm text-gray-600">Join thousands of engineering students</p>
    </div>
    
    <form id="register-form" class="space-y-5">
      <div id="error-message" class="hidden bg-red-50 text-red-500 text-sm p-3 rounded-lg border border-red-100"></div>
      
      <div>
        <label for="name" class="block text-sm font-medium text-gray-700">Full Name</label>
        <input id="name" name="name" type="text" required class="mt-1 block w-full rounded-lg border border-gray-300 px-4 py-2.5 text-gray-900 focus:border-[#1d7bf5] focus:outline-none focus:ring-1 focus:ring-[#1d7bf5] shadow-sm text-sm" placeholder="Rohit Kumar">
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Email Address</label>
        <input id="email" name="email" type="email" required class="mt-1 block w-full rounded-lg border border-gray-300 px-4 py-2.5 text-gray-900 focus:border-[#1d7bf5] focus:outline-none focus:ring-1 focus:ring-[#1d7bf5] shadow-sm text-sm" placeholder="student@college.edu">
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
        <input id="password" name="password" type="password" required class="mt-1 block w-full rounded-lg border border-gray-300 px-4 py-2.5 text-gray-900 focus:border-[#1d7bf5] focus:outline-none focus:ring-1 focus:ring-[#1d7bf5] shadow-sm text-sm" placeholder="••••••••">
      </div>

      <div>
        <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-bold text-white bg-[#1d7bf5] hover:bg-[#1565d8] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#1d7bf5] transition">
          Create Account
        </button>
      </div>
    </form>
    
    <div class="mt-6 text-center text-sm">
      <span class="text-gray-500">Already have an account?</span>
      <a href="/login.html" class="font-semibold text-[#1d7bf5] hover:text-[#1565d8]">Log in</a>
    </div>
  </div>
</main>

<footer class="w-full bg-[#0b1325] text-gray-300 pt-8 pb-8 border-t border-slate-800 mt-auto">
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-xs text-gray-400">
  © 2026 SemesterKit.com. All rights reserved.
</div>
</footer>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errorDiv = document.getElementById('error-message');
    
    try {
      const data = await window.api.post('/auth/register', { name, email, password });
      const params = new URLSearchParams(window.location.search);
      const redirectUrl = params.get('redirect') || '/vault.html';
      const target = redirectUrl.startsWith('/') ? redirectUrl : '/' + redirectUrl;
      if (data.token) {
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = target;
      } else {
        alert('Registration successful! Please sign in.');
        window.location.href = `/login.html?redirect=${encodeURIComponent(redirectUrl)}`;
      }
    } catch (err) {
      errorDiv.textContent = err.message;
      errorDiv.classList.remove('hidden');
    }
  });
</script>
</body></html>
