            handwriting: ['Caveat', 'cursive']

<style>
  html, body {
    overflow-x: hidden !important;
    max-width: 100vw !important;
    width: 100% !important;
    margin: 0;
    padding: 0;
  }

<body class="bg-[#f8faff] text-[#1e293b] font-sans antialiased min-h-screen flex flex-col">
<header class="w-full bg-white border-b border-gray-100 sticky top-0 z-50">
<div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 h-16 sm:h-20 flex items-center justify-between gap-2">
<div class="flex items-center space-x-2.5">
<div class="text-[#1d7bf5]">
<svg class="w-8 h-8 sm:w-9 sm:h-9" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3L1 9l4 2.18v6L12 21l7-3.82v-6l2-1.09V17h2V9L12 3zm6.82 6L12 12.72 5.18 9 12 5.28 18.82 9zM17 15.99l-5 2.73-5-2.73v-3.72L12 15l5-2.73v3.72z"></path></svg>
</div>
<a class="text-xl sm:text-2xl font-extrabold text-[#111827] tracking-tight" href="/">SemesterKit<span class="text-[#1d7bf5]">.com</span></a>
</div>
<nav class="hidden md:flex items-center space-x-8 text-[15px] font-medium text-gray-600">
<a class="hover:text-[#1d7bf5] transition" href="/index.html">Home</a>
<a class="hover:text-[#1d7bf5] transition" href="/btech.html">B.Tech</a>
<a class="hover:text-[#1d7bf5] transition" href="/mtech.html">M.Tech</a>
<a class="hover:text-[#1d7bf5] transition" href="/phd.html">PhD</a>
<a class="hover:text-[#1d7bf5] transition" href="/upload.html">Upload</a>
</nav>
<div class="auth-actions-container flex items-center space-x-2 sm:space-x-4">
<button class="px-3 sm:px-5 py-1.5 sm:py-2 text-xs sm:text-sm font-semibold text-[#1d7bf5] hover:text-[#1565d8] transition" type="button" onclick="window.location.href='/login.html'">Login</button>
<button class="px-3 sm:px-6 py-1.5 sm:py-2.5 bg-[#1d7bf5] hover:bg-[#1565d8] text-white text-xs sm:text-sm font-semibold rounded-full shadow-sm transition" type="button" onclick="window.location.href='/register.html'">Sign Up</button>
</div>
</div>
</header>

<main class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-6 sm:py-8 flex-grow w-full min-w-0">
  <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
    <!-- Header -->
    <div class="border-b border-gray-100 p-6 sm:p-8 bg-brand-50 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div>
        <h1 class="text-3xl font-extrabold text-[#0f172a] vault-user-name">My Vault</h1>
        <p class="text-gray-600 mt-1">Manage your saved resources, download history, and review submission moderation statuses.</p>
      </div>
      <div class="flex gap-3 text-center">
        <div class="bg-white rounded-xl p-3 shadow-xs border border-blue-100 min-w-[80px]">
          <span class="text-[10px] text-gray-500 font-bold uppercase tracking-wider block">Approved</span>
          <span id="stat-approved-uploads" class="text-xl font-extrabold text-emerald-600">0</span>
        </div>
        <div class="bg-white rounded-xl p-3 shadow-xs border border-blue-100 min-w-[80px]">
          <span class="text-[10px] text-gray-500 font-bold uppercase tracking-wider block">Pending</span>
          <span id="stat-pending-uploads" class="text-xl font-extrabold text-amber-500">0</span>
        </div>
        <div class="bg-white rounded-xl p-3 shadow-xs border border-blue-100 min-w-[80px]">
          <span class="text-[10px] text-gray-500 font-bold uppercase tracking-wider block">Bookmarks</span>
          <span id="stat-bookmarks-count" class="text-xl font-extrabold text-brand-600">0</span>
        </div>
      </div>
    </div>
    
    <!-- Tabs -->
    <div class="flex border-b border-gray-100 overflow-x-auto">
      <button onclick="switchTab('bookmarks')" id="tab-bookmarks" class="px-6 py-4 font-semibold text-brand-600 border-b-2 border-brand-600 whitespace-nowrap">Saved Resources</button>
      <button onclick="switchTab('downloads')" id="tab-downloads" class="px-6 py-4 font-medium text-gray-500 hover:text-gray-700 whitespace-nowrap">Download History</button>
      <button onclick="switchTab('uploads')" id="tab-uploads" class="px-6 py-4 font-medium text-gray-500 hover:text-gray-700 whitespace-nowrap">My Uploads</button>
    </div>

    <!-- Content Area -->
    <div class="p-6 sm:p-8 bg-gray-50 min-h-[400px]">
      <div id="vault-content" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- JS will populate cards here -->
        <p class="text-gray-500">Loading...</p>
      </div>
    </div>
  </div>
</main>

<footer class="w-full bg-[#0b1325] text-gray-300 pt-8 pb-8 border-t border-slate-800 mt-auto">
